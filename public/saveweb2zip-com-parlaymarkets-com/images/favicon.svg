<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fffc0"/>
      <stop offset="100%" stop-color="#19d494"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0a1512"/>

  <!-- Top layer — filled diamond (the solid top face of the stack) -->
  <polygon points="32,11 9,22 32,33 55,22" fill="url(#g)"/>

  <!-- Middle layer — chevron outline -->
  <polyline points="9,30 32,41 55,30"
    stroke="#22e0a0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Bottom layer — chevron outline, more faded -->
  <polyline points="9,38 32,49 55,38"
    stroke="#22e0a0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
</svg>
